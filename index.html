    body {
      margin: 0;
      padding: 0;
      background-image: url('https://img.freepik.com/vector-gratis/fondo-abstracto-acuarela-colorida_23-2149108517.jpg?semt=ais_hybrid&w=740&q=80');

      background-position: center;

      text-align: center;

    h1 {
      margin-top: 50px;

      font-size: 2em;
      margin-bottom: 15px;

    p, li {

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
      background-color: rgba(255,255,255,0.7);
      margin: 0;

    nav ul li a {
      text-decoration: none;
      color: black;
      font-weight: bold;
      padding: 10px 15px;

    }

    }

    .practicas {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 40px;
      gap: 30px;
      flex-wrap: wrap;
    }

    .practicas img {
      width: 300px;
      border-radius: 10px;
    }

    .practicas ul {
      text-align: left;
      padding-left: 20px;
      background-color: rgba(255,255,255,0.8);
      border-radius: 10px;
